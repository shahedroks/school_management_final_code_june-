# dart run flutter_launcher_icons
# Uses Garini logo; keep in sync with pubspec `flutter_launcher_icons` if you remove this file.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/Logo.png
  min_sdk_android: 21
  adaptive_icon_background: "#1F3C88"
  adaptive_icon_foreground: assets/Logo.png
  remove_alpha_ios: true

  web:
    generate: false

  windows:
    generate: false

  macos:
    generate: false
